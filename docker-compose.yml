services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-emailpoc}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-emailpoc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The web app — EmailPOC AND the Bedrock Availability POC in one process
  # (src/app.py mounts bedrock_availability_poc/'s routes into this same
  # FastAPI app), served on one port. On every start, its entrypoint
  # (docker/entrypoint.sh) runs `alembic upgrade head` against the "db"
  # service above before launching Uvicorn — the database schema is
  # created/updated automatically, and re-running it (container restart,
  # `docker compose up` again, etc.) never raises a duplicate-object error
  # because Alembic tracks what has already been applied.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Run as the host user that owns ./data, NOT as root. The bind mount
    # below is the same directory the app writes inbound attachments into,
    # and a root-owned container creates ./data/attachments as root:root on
    # the host — after which running the app locally (uv/uvicorn, uid 1000)
    # fails every attachment write with "[Errno 13] Permission denied" and
    # silently drops the files. Override with APP_UID/APP_GID in .env if the
    # host account is not uid/gid 1000 (check with `id -u` / `id -g`).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
